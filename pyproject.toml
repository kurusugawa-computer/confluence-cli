[project]
name = "kci-confluence-cli"
dynamic = ["version"]
description = "Confluence v6.15.7を操作するためのCLIです。"
authors = [{ name = "Kurusugawa Computer Inc." }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Topic :: Utilities",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "requests",
    "backoff",
    "pyquery>=2",
    "requests-toolbelt>=1",
    "more-itertools",
    "pyyaml",
    "lxml",
]

[project.urls]
Repository = "https://github.com/kurusugawa-computer/confluence-cli"

[dependency-groups]
dev = ["ipython"]
test = ["pytest>=9", "pytest-xdist", "pytest-cov"]
linter = ["ruff", "mypy>=2", "types-pytz", "types-requests", "types-python-dateutil", "types-PyYAML"]
docs = ["sphinx>=7", "pydata-sphinx-theme>=0.13", "sphinx-argparse"]

[tool.uv]
default-groups = ["dev", "test", "linter", "docs"]
package = true

[project.scripts]
confluence = "confluence.__main__:main"

[tool.mypy]
# スタブが無いパッケージのエラーは無視させる.サードパーティのライブラリに型情報がないケースもあるため
ignore_missing_imports = true
# 型ヒントが付いていない関数もチェックする
check_untyped_defs = true


[tool.ruff]
target-version = "py312"
line-length = 150

[tool.ruff.lint]
ignore = [
    "CPY001", # copyright notice: 既存コードに著作権ヘッダーを付けていないため
    "G004", # `logging-f-string` : loggingでf-stringを使いたいので無視する
    "RUF001", # 全角記号など`ambiguous unicode character`も使いたいため
    "RUF002",# 全角記号など`ambiguous unicode character`も使いたいため
    "RUF003",# 全角記号など`ambiguous unicode character`も使いたいため
    "RUF036", # `None | str` の順序を既存コードで使用しているため
    "PLR2004", # magic-value-comparison: listのサイズで判定するときがよくあるため
    "ANN002", # missing-type-args
    "ANN003", # missing-type-kwargs
    "ERA", # : 役立つこともあるが、コメントアウトしていないコードも警告されるので無視する
    "UP007", # non-pep604-annotation :

    # 以下のルールはコードに合っていないので無効化した
    "RSE", # flake8-raise
    "D", # pydocstyle, Docstringを中途半端にしか書いていないので、除外する
    "C90", # mccabe
    "T20", # flake8-print
    "SLF", #  flake8-self
    "BLE", # flake8-blind-except
    "FBT", # flake8-boolean-trap
    "TRY", # tryceratops
    "COM", # flake8-commas
    "S", # flake8-bandit
    "EM",#flake8-errmsg
    "EXE", # flake8-executable
    "ICN", # flake8-import-conventions
    "RET",#flake8-return
    "SIM",#flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", #pathlibを使わないコードが多いので、除外する
    "ISC", #flake8-implicit-str-concat
    "N", # pep8-naming
    "PT", # flake8-pytest-style
]


select = [
    "ALL"
]

[tool.ruff.lint.per-file-ignores]
# テストコードはチェックを緩和する
"tests/**.py" = [
    "PGH",  # pygrep-hooks
    "DTZ",  # flake8-datetimez
    "ANN",  # flake8-annotations
    "E501",  # line-too-long
    "RUF100"  # unused-noqa
]



[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 10


[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["confluence"]
